services:
  vereinsdienste:
    image: ghcr.io/code-jaeg/veranstaltungstool-vereine:latest
    container_name: Vereinsdienste
    restart: unless-stopped
    environment:
      TZ: "Europe/Berlin"
      BASE_URL: "https://foerderverein-khs.sauer-jaeger.de"
      APP_NAME: "Helferplanung Förderverein Klosterhofschule"
      CREATE_PASSWORD: "${CREATE_PASSWORD}"
      # Mails gehen an n8n (Workflow „Vereinsdienste · Mailversand“) und von dort über Mailcow raus
      MAIL_WEBHOOK_URL: "http://192.168.178.91:5678/webhook/vereinsdienste/mail"
      MAIL_FROM: "Förderverein KHS · Helferplanung <andreas.jaeger@sauer-jaeger.de>"
      # Absagen zusätzlich über n8n (Workflow „Vereinsdienste · Ausfall-Meldung“) per Telegram/Push
      N8N_WEBHOOK_URL: "http://192.168.178.91:5678/webhook/vereinsdienste/ereignis"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET}"
      REMINDER_HOURS: "48,3"
      DATA_RETENTION_DAYS: "30"
      # Impressum/Datenschutz
      OPERATOR_NAME: "Förderverein Klosterhofschule Nellingen e.V."
      OPERATOR_ADDRESS: "Klosterhof 2\n73760 Ostfildern"
      OPERATOR_EMAIL: "info@foerderverein-klosterhofschule.de"
      OPERATOR_REPRESENTATIVE: "Jan Weiss, Andreas Jäger, Sandro Coletti"
      OPERATOR_REGISTER: "VR 211519, Registergericht Stuttgart"
      OPERATOR_PRIVACY_URL: "https://foerderverein-klosterhofschule.de/datenschutzerklaerung/"
      OPERATOR_PRIVACY_NOTE: "Wenn Sie uns per E-Mail kontaktieren, verarbeiten wir Ihre personenbezogenen Daten nur, soweit an der Verarbeitung ein berechtigtes Interesse besteht (Art. 6 Abs. 1 lit. f DSGVO), Sie in die Datenverarbeitung eingewilligt haben (Art. 6 Abs. 1 lit. a DSGVO), die Verarbeitung für die Anbahnung, Begründung, inhaltliche Ausgestaltung oder Änderung eines Rechtsverhältnisses zwischen Ihnen und uns erforderlich sind (Art. 6 Abs. 1 lit. b DSGVO) oder eine sonstige Rechtsnorm die Verarbeitung gestattet. Ihre personenbezogenen Daten verbleiben bei uns, bis Sie uns zur Löschung auffordern, Ihre Einwilligung zur Speicherung widerrufen oder der Zweck für die Datenspeicherung entfällt (z. B. nach abgeschlossener Bearbeitung Ihres Anliegens). Zwingende gesetzliche Bestimmungen – insbesondere steuer- und handelsrechtliche Aufbewahrungsfristen – bleiben unberührt. Sie haben jederzeit das Recht, unentgeltlich Auskunft über Herkunft, Empfänger und Zweck Ihrer gespeicherten personenbezogenen Daten zu erhalten. Ihnen steht außerdem ein Recht auf Widerspruch, auf Datenübertragbarkeit und ein Beschwerderecht bei der zuständigen Aufsichtsbehörde zu. Ferner können Sie die Berichtigung, die Löschung und unter bestimmten Umständen die Einschränkung der Verarbeitung Ihrer personenbezogenen Daten verlangen."
    volumes:
      - /volume2/docker/vereinsdienste/data:/data
    ports:
      - "8230:3000"
